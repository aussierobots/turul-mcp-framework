[package]
name = "simple-postgres-session"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
# Three binaries (server + setup + teardown); name the server so
# `cargo run -p simple-postgres-session` is unambiguous.
default-run = "simple-postgres-session"

[[bin]]
test = false
name = "simple-postgres-session"
path = "src/main.rs"

[[bin]]
test = false
name = "postgres-setup"
path = "src/bin/postgres-setup.rs"

[[bin]]
test = false
name = "postgres-teardown"
path = "src/bin/postgres-teardown.rs"


[dependencies]
turul-mcp-server = { workspace = true, features = ["http", "sse", "postgres"] }
turul-mcp-session-storage = { workspace = true, features = ["postgres"] }
turul-mcp-derive.workspace = true
turul-mcp-builders.workspace = true
turul-mcp-protocol.workspace = true

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
url.workspace = true

[features]
default = []
