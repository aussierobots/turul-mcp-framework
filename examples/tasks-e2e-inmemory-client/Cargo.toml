[package]
name = "tasks-e2e-inmemory-client"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

# 2025-11-25 regression example (tasks are core only in 2025-11-25). The client is
# bilingual; turul-mcp-protocol is pinned to the 2025 opt-in for the task types.
[dependencies]
turul-mcp-client.workspace = true
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "tasks-e2e-inmemory-client"
path = "src/main.rs"
test = false
