# Smoke client for lambda-mcp-server, which is PINNED to the 2025-11-25
# stateful lane — the bilingual McpClient inside negotiates down to 2025
# against it (initialize handshake + Mcp-Session-Id). For the 2026 stateless
# client pattern see streamable-http-client.
[package]
name = "lambda-turul-mcp-client"
version = "0.4.0"
edition.workspace = true
description = "Smoke client for lambda-turul-mcp-server (probe + interactive session)"
license = "MIT"

[[bin]]
test = false
name = "lambda-turul-mcp-client"
path = "src/main.rs"

[dependencies]
turul-mcp-client = { workspace = true }
tokio = { workspace = true, features = ["full"] }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

clap.workspace = true
colored.workspace = true
