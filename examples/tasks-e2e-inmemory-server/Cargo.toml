[package]
name = "tasks-e2e-inmemory-server"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

# 2025-11-25 regression example: tasks are core only in 2025-11-25 (moved to an
# extension in 2026-07-28), so the framework deps are pinned to the 2025 opt-in
# independent of the workspace's 2026 default.
[dependencies]
turul-mcp-server = { path = "../../crates/turul-mcp-server", version = "0.4.0", default-features = false, features = ["http", "sse", "protocol-2025-11-25"] }
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-derive = { path = "../../crates/turul-mcp-derive", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-builders = { path = "../../crates/turul-mcp-builders", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-task-storage.workspace = true
async-trait.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "tasks-e2e-inmemory-server"
path = "src/main.rs"
test = false
