# Drives a FOREIGN MCP server with turul-mcp-client. Not in default-members:
# it is only useful when pointed at a peer implementation, and the interop
# scripts build it on demand.
[package]
name = "interop-client-probe"
version = "0.4.0"
edition.workspace = true
description = "Drives a foreign MCP 2026-07-28 server with turul-mcp-client and reports per-leg results"

[[bin]]
name = "interop-client-probe"
path = "src/main.rs"
test = false

[dependencies]
turul-mcp-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
