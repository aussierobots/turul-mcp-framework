# The 2026-07-28 stateless client example — the client half of the lane's
# canonical pair. Corresponding server example: minimal-server (2026 default,
# port 8641). The bilingual McpClient negotiates per connection; against a
# 2026 server it locks 2026-07-28 and every request carries per-request
# _meta + the SEP-2243 headers automatically.
[package]
name = "streamable-http-client-2026-07-28"
version = "0.4.0"
edition.workspace = true

[[bin]]
name = "streamable-http-client-2026-07-28"
path = "src/main.rs"
test = false

[dependencies]
turul-mcp-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
