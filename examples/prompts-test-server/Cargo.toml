[package]
name = "prompts-test-server"
version = "0.4.0"
edition.workspace = true
description = "MCP Prompts Test Server - Comprehensive test prompts for E2E validation"
license = "MIT OR Apache-2.0"

[[bin]]
test = false
name = "prompts-test-server"
path = "src/main.rs"

# 2025-11-25 E2E fixture; framework deps pinned to the 2025 opt-in independent of the workspace 2026 default.
[dependencies]
# Framework dependencies
turul-mcp-server = { path = "../../crates/turul-mcp-server", version = "0.4.0", default-features = false, features = ["http", "sse", "protocol-2025-11-25"] }
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-builders = { path = "../../crates/turul-mcp-builders", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }

# Async runtime
tokio.workspace = true

# HTTP server
hyper.workspace = true
hyper-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Time
chrono.workspace = true

# Async trait
async-trait.workspace = true

# Command line parsing
clap.workspace = true
