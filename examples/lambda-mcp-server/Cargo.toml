[package]
name = "lambda-turul-mcp-server"
version = "0.4.0"
edition.workspace = true
description = "AWS Lambda MCP server with SSE snapshots (non-streaming)"
license = "MIT"

[[bin]]
test = false
name = "lambda-turul-mcp-server"
path = "src/main.rs"

[dependencies]
# Lambda runtime with streaming support
lambda_http.workspace = true
lambda_runtime.workspace = true

# AWS SDK for DynamoDB, SNS, SQS integration
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-sns.workspace = true
aws-sdk-sqs.workspace = true

# Our MCP framework
# 2025-11-25 regression example; framework deps pinned to the 2025 opt-in
# independent of the workspace 2026 default.
turul-mcp-server = { path = "../../crates/turul-mcp-server", version = "0.4", default-features = false, features = ["http", "sse", "dynamodb", "protocol-2025-11-25"] }
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-derive = { path = "../../crates/turul-mcp-derive", version = "0.4", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-session-storage = { path = "../../crates/turul-mcp-session-storage", version = "0.4", default-features = false, features = ["in-memory", "dynamodb", "protocol-2025-11-25"] }
turul-mcp-builders = { path = "../../crates/turul-mcp-builders", version = "0.4", default-features = false, features = ["protocol-2025-11-25"] }
turul-http-mcp-server = { path = "../../crates/turul-http-mcp-server", version = "0.4", default-features = false, features = ["sse", "protocol-2025-11-25"] }
turul-mcp-json-rpc-server = { workspace = true }
turul-mcp-aws-lambda = { path = "../../crates/turul-mcp-aws-lambda", version = "0.4", default-features = false, features = ["cors", "sse", "protocol-2025-11-25"] }
async-trait = { workspace = true }

# Tower middleware for Lambda
tower = { workspace = true }
tower-http = { workspace = true }

# HTTP and JSON handling
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# HTTP and Hyper support for streaming
http = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

# Date/time handling
chrono = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }

# Error handling and logging
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# URL encoding for SSE parameters
urlencoding = { workspace = true }

# Additional dependencies for tools
md5.workspace = true

[dev-dependencies]
tokio-test.workspace = true

[features]
default = ["lambda"]
lambda = []
local = []
