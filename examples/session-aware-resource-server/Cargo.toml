[package]
name = "session-aware-resource-server"
version = "0.4.0"
edition.workspace = true
publish = false

[dependencies]
# Deliberately pinned to the 2025-11-25 stateful lane: session-aware
# resources require cross-request sessions, which the 2026 stateless core
# does not have.
turul-mcp-server = { path = "../../crates/turul-mcp-server", version = "0.4", default-features = false, features = ["http", "sse", "protocol-2025-11-25"] }
turul-mcp-derive = { path = "../../crates/turul-mcp-derive", version = "0.4", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-builders = { path = "../../crates/turul-mcp-builders", version = "0.4", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4", default-features = false, features = ["protocol-2025-11-25"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { workspace = true, features = ["serde"] }

[[bin]]
test = false
name = "session-aware-resource-server"
path = "src/main.rs"