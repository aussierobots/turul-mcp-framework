[package]
name = "client-initialise-server"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

# 2025-11-25 regression example: the stateful `initialize`/`Mcp-Session-Id`
# lifecycle is not part of this branch's 2026 default path. Pinned to the 2025 opt-in.
[features]
default = ["sqlite", "postgres", "dynamodb"]
sqlite = ["turul-mcp-session-storage/sqlite"]
postgres = ["turul-mcp-session-storage/postgres"]
dynamodb = ["turul-mcp-session-storage/dynamodb"]

[dependencies]
turul-mcp-server = { path = "../../crates/turul-mcp-server", version = "0.4.0", default-features = false, features = ["http", "sse", "protocol-2025-11-25"] }
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-builders = { path = "../../crates/turul-mcp-builders", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-session-storage = { path = "../../crates/turul-mcp-session-storage", version = "0.4.0", default-features = false, features = ["in-memory", "protocol-2025-11-25"] }
turul-mcp-derive = { path = "../../crates/turul-mcp-derive", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
anyhow.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
[[bin]]
name = "client-initialise-server"
path = "src/main.rs"
test = false
