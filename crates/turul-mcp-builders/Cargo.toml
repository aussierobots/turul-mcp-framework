[package]
name = "turul-mcp-builders"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Runtime builders for MCP (Model Context Protocol) components"
readme = "README.md"
keywords = ["mcp", "protocol", "builders", "runtime"]
categories = ["development-tools", "api-bindings"]

[features]
default = ["protocol-2026-07-28"]
protocol-2025-11-25 = ["turul-mcp-protocol/protocol-2025-11-25"]
protocol-2026-07-28 = ["turul-mcp-protocol/protocol-2026-07-28"]

[dependencies]
# Protocol alias for current version
turul-mcp-protocol = { path = "../turul-mcp-protocol", version = "0.4", default-features = false }
turul-rpc = { workspace = true, features = ["async"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
schemars.workspace = true

[dev-dependencies]
tokio.workspace = true
