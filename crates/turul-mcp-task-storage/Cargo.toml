[package]
name = "turul-mcp-task-storage"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Task storage abstractions for Model Context Protocol (MCP) servers - durable state machines for long-running operations"

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "v7"] }
chrono = { workspace = true, features = ["serde"] }

# Protocol types
turul-mcp-protocol = { path = "../turul-mcp-protocol", version = "0.4.0", default-features = false }
# Optional database support
sqlx = { workspace = true, optional = true }

# AWS SDK dependencies
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }

# DynamoDB cursor encoding
base64 = { workspace = true, optional = true }

[features]
default = ["in-memory", "protocol-2025-11-25"]
protocol-2025-11-25 = ["turul-mcp-protocol/protocol-2025-11-25"]
protocol-2026-07-28 = ["turul-mcp-protocol/protocol-2026-07-28"]
in-memory = ["tokio"]
sqlite = ["sqlx", "tokio"]
postgres = ["sqlx", "tokio"]
dynamodb = ["aws-config", "aws-sdk-dynamodb", "tokio", "base64"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
