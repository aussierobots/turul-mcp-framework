[package]
name = "turul-mcp-json-rpc-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Compatibility shim re-exporting turul-rpc — see turul-rpc on crates.io for current development."

[features]
default = ["async"]
async = ["turul-rpc/async"]
streams = ["async", "turul-rpc/streams"]

[dependencies]
turul-rpc = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
