[package]
name = "turul-mcp-client"
version = "0.4.20"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Comprehensive MCP client library with multi-transport support"
readme = "README.md"
documentation = "https://docs.rs/turul-mcp-client"
keywords.workspace = true
categories = ["network-programming"]


[package.metadata.docs.rs]
# Build the opt-in features too, so their API appears on docs.rs.
features = ["ext-tasks", "ext-apps", "ext-skills", "oauth-client-credentials"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# MCP framework dependencies.
# The client links the versioned protocol crates directly and does NOT depend
# on the turul-mcp-protocol alias (the recorded exception to the Protocol
# Re-export Rule). The frozen 2025-11-25 crate is unconditional: it is the
# public lingua-franca type vocabulary (Tool, CallToolResult, ...) returned by
# every client API regardless of the negotiated wire spec. The 2026-07-28
# crate carries the modern wire path and is feature-gated. Keeping the alias
# out of this crate is load-bearing: a dependency graph may otherwise unify
# the alias's protocol features and trip the spec mutex (e.g. linking this
# client and a 2026-default server into one test binary).
turul-mcp-protocol-2025-11-25 = { workspace = true }
turul-mcp-ext-tasks = { workspace = true, optional = true }
turul-mcp-ext-apps = { workspace = true, optional = true }
turul-mcp-ext-skills = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
turul-mcp-protocol-2026-07-28 = { workspace = true, optional = true }
turul-rpc = { workspace = true }
# JSON Schema 2020-12 dialect validation, client-side trust boundary.
# A dedicated leaf crate with no dependency on any protocol crate (normal or
# alias) — safe to link unconditionally without any alias-mutex risk.
# 2026-07-28 wire path only: validates tools/list inputSchema.
turul-mcp-schema-validation = { workspace = true, optional = true }

# Async runtime (tokio itself is per target, below)
futures = { workspace = true }
async-trait = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["json", "stream", "http2"] }

# JSON handling
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
url = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }

# Logging
tracing = { workspace = true }

# Native: every line as before, moved into a target table (ADR-040 §7).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
hyper = { workspace = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
# Client assertion signing (oauth-client-credentials); same major as turul-jwt-validator's.
jsonwebtoken = { workspace = true, optional = true }

# wasm32 under wasm-bindgen (ADR-040): no tokio runtime, fetch-backed reqwest.
# tokio and tokio-util are declared here, not inherited: the workspace entries
# enable `net`, which pulls mio, and inheritance can only add features.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec", "io"], optional = true }
web-time = "1.1"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { workspace = true, features = ["wasm_js"] }

[features]
default = ["http", "sse", "client-bilingual"]
# Transport features
http = ["tokio-util"]
sse = ["tokio-util"]

# Spec-coexistence (mutually exclusive — enforced by compile_error! in lib.rs).
# Bilingual (default) links both protocol crates; one McpClient negotiates the
# wire spec per connection at connect() time.
client-bilingual = ["dep:turul-mcp-protocol-2026-07-28", "dep:turul-mcp-schema-validation"]
# Tasks extension (io.modelcontextprotocol/tasks, SEP-2663) client surface —
# 2026-07-28 connections only; off by default per SEP-2133.
ext-tasks = ["dep:turul-mcp-ext-tasks"]
# MCP Apps extension (io.modelcontextprotocol/ui) declaration and `_meta.ui`
# accessors; 2026-07-28 connections only; off by default per SEP-2133. No rendering.
ext-apps = ["dep:turul-mcp-ext-apps"]
# Skills extension (io.modelcontextprotocol/skills, SEP-2640; ADR-033 §6) client surface —
# 2026-07-28 connections only; off by default per SEP-2133.
ext-skills = ["dep:turul-mcp-ext-skills", "dep:base64"]
# OAuth Client Credentials extension (io.modelcontextprotocol/oauth-client-credentials;
# ADR-039): the HTTP transport obtains machine-to-machine tokens itself. Off by default.
oauth-client-credentials = ["dep:jsonwebtoken"]
# Narrowing: each speaks exactly ONE wire spec. Requires --no-default-features
# (otherwise client-bilingual is also active and the mutex fires). The frozen
# 2025-11-25 protocol crate is always linked as the shared type vocabulary;
# narrowing controls which WIRE paths compile.
client-2025-11-25-only = []
client-2026-07-28-only = ["dep:turul-mcp-protocol-2026-07-28", "dep:turul-mcp-schema-validation"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
regex = { workspace = true }
tokio-test.workspace = true
wiremock.workspace = true
# Real-server e2e: bilingual client against an in-process 2026 stateless server.
# Default features (http, sse -> protocol-2026-07-28); no alias-mutex conflict
# because this crate links the versioned protocol crates directly, not the alias.
turul-mcp-server = { path = "../turul-mcp-server", version = "0.4.14", features = ["ext-tasks", "ext-skills"] }
# NOTE: the four-backend Tasks e2e deliberately does NOT live here. It links
# sqlx and aws-sdk-dynamodb, and an MCP *client* library has no business
# dev-depending on Postgres and DynamoDB drivers — it also coupled
# `cargo publish -p turul-mcp-client` to `turul-mcp-ext-tasks` having already
# published its storage features, which is how the 0.4.1 dry-run failed. The
# suite is in the publish=false crate `tests-ext-tasks/` instead.
turul-mcp-derive = { path = "../turul-mcp-derive", version = "0.4.6" }
# The derive macros expand to `turul_mcp_protocol::` / `turul_mcp_builders::`
# paths, so the e2e test target needs both (2026 default, matching the dev
# server). Dev-only: the published client library links neither.
turul-mcp-protocol = { path = "../turul-mcp-protocol", version = "0.4.2" }
turul-mcp-builders = { path = "../turul-mcp-builders", version = "0.4.4" }
# The frozen 0.3.47 server, in-process, so the legacy-server probe test asserts
# on the bytes it really sends rather than a hand-written mock.
turul-mcp-server-legacy = { package = "turul-mcp-server", version = "=0.3.47" }
# OAuth Client Credentials tests (ADR-039): a real resource server validating
# tokens a wiremock authorization server signs, and the keys to sign them.
turul-mcp-oauth = { path = "../turul-mcp-oauth", version = "0.4.5" }
jsonwebtoken.workspace = true
rsa.workspace = true
crypto-bigint.workspace = true
base64.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
base64.workspace = true
