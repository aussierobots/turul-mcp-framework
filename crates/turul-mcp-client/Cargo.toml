[package]
name = "turul-mcp-client"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Comprehensive MCP client library with multi-transport support"

[dependencies]
# MCP framework dependencies.
# The client links each versioned protocol crate directly (gated by the
# client-bilingual / client-2025-11-25-only / client-2026-07-28-only features) so one client
# can speak both wire specs. turul-mcp-protocol (the alias) is retained
# transitionally as the public lingua-franca type surface while existing code
# paths migrate to version-routed modules; it is pinned to protocol-2025-11-25
# (independent of the workspace default) so those 2025-typed paths keep compiling.
turul-mcp-protocol = { path = "../turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-protocol-2025-11-25 = { workspace = true, optional = true }
turul-mcp-protocol-2026-07-28 = { workspace = true, optional = true }
turul-rpc = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
async-trait = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["json", "stream", "http2"] }
hyper = { workspace = true }

# JSON handling
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
url = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }

# Logging
tracing = { workspace = true }

# Optional features for different transports
tokio-util = { workspace = true, features = ["codec"], optional = true }

[features]
default = ["http", "sse", "client-bilingual"]
# Transport features
http = []
sse = ["tokio-util"]
stdio = ["tokio-util"]
# All transports
all-transports = ["http", "sse", "stdio"]

# Spec-coexistence (mutually exclusive — enforced by compile_error! in lib.rs).
# Bilingual (default) links both protocol crates; one McpClient negotiates the
# wire spec per connection at connect() time.
client-bilingual = ["dep:turul-mcp-protocol-2025-11-25", "dep:turul-mcp-protocol-2026-07-28"]
# Narrowing: each links exactly ONE protocol crate. Requires --no-default-features
# (otherwise client-bilingual is also active and the mutex fires).
client-2025-11-25-only = ["dep:turul-mcp-protocol-2025-11-25"]
client-2026-07-28-only = ["dep:turul-mcp-protocol-2026-07-28"]

[dev-dependencies]
tokio-test.workspace = true
wiremock = "0.6"
