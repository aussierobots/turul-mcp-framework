[package]
name = "turul-mcp-server"
version = "0.4.12"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-level framework for building Model Context Protocol (MCP) servers"
readme = "README.md"
documentation = "https://docs.rs/turul-mcp-server"
keywords.workspace = true
categories = ["network-programming"]

[features]
default = ["http", "sse", "protocol-2026-07-28"]
protocol-2025-11-25 = ["turul-mcp-derive/protocol-2025-11-25", "turul-mcp-protocol/protocol-2025-11-25", "turul-mcp-builders/protocol-2025-11-25", "turul-mcp-session-storage/protocol-2025-11-25", "dep:turul-mcp-task-storage", "turul-mcp-task-storage/protocol-2025-11-25", "turul-http-mcp-server?/protocol-2025-11-25", "turul-mcp-session-storage/in-memory", "turul-mcp-task-storage/in-memory"]
protocol-2026-07-28 = ["turul-mcp-derive/protocol-2026-07-28", "turul-mcp-protocol/protocol-2026-07-28", "turul-mcp-builders/protocol-2026-07-28", "turul-mcp-session-storage/protocol-2026-07-28", "turul-http-mcp-server?/protocol-2026-07-28", "turul-mcp-session-storage/in-memory", "dep:turul-mcp-schema-validation"]
http = ["turul-http-mcp-server"]
sse = ["turul-http-mcp-server/sse"]
sqlite = ["turul-mcp-session-storage/sqlite", "turul-mcp-task-storage?/sqlite", "turul-mcp-server-state-storage?/sqlite"]
postgres = ["turul-mcp-session-storage/postgres", "turul-mcp-task-storage?/postgres", "turul-mcp-server-state-storage?/postgres"]
dynamodb = ["turul-mcp-session-storage/dynamodb", "turul-mcp-task-storage?/dynamodb", "turul-mcp-server-state-storage?/dynamodb"]
dynamic-tools = ["turul-mcp-server-state-storage"]
# Tasks extension (io.modelcontextprotocol/tasks, SEP-2663) on the 2026 lane.
# Off by default: SEP-2133 requires extensions disabled unless opted into.
ext-tasks = ["protocol-2026-07-28", "dep:turul-mcp-ext-tasks", "dep:turul-mcp-oauth"]
# Skills extension (io.modelcontextprotocol/skills, SEP-2640; ADR-033). Off by default.
ext-skills = ["protocol-2026-07-28", "dep:turul-mcp-ext-skills"]
test-utils = []

[dependencies]
turul-mcp-ext-tasks = { workspace = true, optional = true }
turul-mcp-ext-skills = { workspace = true, optional = true }
# Framework dependencies
turul-rpc = { workspace = true, features = ["async"] }
turul-mcp-protocol = { path = "../turul-mcp-protocol", version = "0.4", default-features = false }
turul-mcp-session-storage = { path = "../turul-mcp-session-storage", version = "0.4", default-features = false }
turul-mcp-builders = { path = "../turul-mcp-builders", version = "0.4", default-features = false }
turul-mcp-derive = { path = "../turul-mcp-derive", version = "0.4", default-features = false }
# 2026-07-28 lane only: tools/list inputSchema validation.
turul-mcp-schema-validation = { workspace = true, optional = true }
# ext-tasks only: binds a task to the OAuth `sub` claim.
turul-mcp-oauth = { path = "../turul-mcp-oauth", version = "0.4", default-features = false, optional = true }
turul-mcp-task-storage = { path = "../turul-mcp-task-storage", version = "0.4", default-features = false, optional = true }
turul-http-mcp-server = { path = "../turul-http-mcp-server", version = "0.4", default-features = false, optional = true }
turul-mcp-server-state-storage = {workspace = true, optional = true}

# Runtime utilities for task cancellation
tokio-util = { workspace = true }

# Core dependencies
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
base64.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true, features = ["serde"] }
regex.workspace = true
once_cell.workspace = true
urlencoding.workspace = true

[dev-dependencies]
# tests/oauth_2026.rs wires the resource server without the ext-tasks feature.
turul-mcp-oauth = { path = "../turul-mcp-oauth", version = "0.4", default-features = false }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
# Protocol feature comes from the server's own normal-dep forwarding; the dev-dep
# must not also pull a default (protocol-2025-11-25), or the alias sees both specs.
turul-mcp-builders = { path = "../turul-mcp-builders", version = "0.4", default-features = false }
reqwest = { workspace = true, features = ["stream"] }
turul-mcp-ext-apps.workspace = true
bytes.workspace = true
serde_json.workspace = true
