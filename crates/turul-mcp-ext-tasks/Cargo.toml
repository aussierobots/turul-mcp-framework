# Extension crates version independently (SEP-2133 §Evolution) — literal
# version, never version.workspace = true.
[package]
name = "turul-mcp-ext-tasks"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP Tasks extension (io.modelcontextprotocol/tasks, SEP-2663) — spec-neutral crate, 2026-07-28 lane first"
readme = "README.md"

[features]
default = ["protocol-2026-07-28"]
