[package]
name = "mcp-tools-tests"
version = "0.4.0"
edition.workspace = true
autotests = false
description = "MCP Tools Protocol Integration Tests"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# HTTP client for E2E testing
reqwest.workspace = true

# JSON handling
serde_json.workspace = true
serde.workspace = true

# Async runtime
tokio.workspace = true

# Test utilities
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Time utilities
chrono.workspace = true

# Async utilities
futures.workspace = true

# Shared E2E test utilities
mcp-e2e-shared.workspace = true

# Additional dependencies for test server binary
# 2025-11-25 E2E regression crate; framework deps pinned to the 2025 opt-in independent of the workspace 2026 default.
turul-mcp-server = { path = "../../crates/turul-mcp-server", version = "0.4.0", default-features = false, features = ["http", "sse", "protocol-2025-11-25"] }
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-derive = { path = "../../crates/turul-mcp-derive", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-builders = { path = "../../crates/turul-mcp-builders", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
clap.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
schemars.workspace = true

[dev-dependencies]
serial_test.workspace = true

[[bin]]
name = "tools-test-server-e2e"
path = "bin/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"
