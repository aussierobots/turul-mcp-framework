[package]
name = "mcp-elicitation-tests"
version = "0.4.0"
edition.workspace = true
autotests = false

[dependencies]
# Core framework
# 2025-11-25 E2E regression crate; framework deps pinned to the 2025 opt-in independent of the workspace 2026 default.
turul-mcp-server = { path = "../../crates/turul-mcp-server", version = "0.4.0", default-features = false, features = ["http", "sse", "protocol-2025-11-25"] }
turul-mcp-protocol = { path = "../../crates/turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-builders = { path = "../../crates/turul-mcp-builders", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }

# Shared test utilities
mcp-e2e-shared.workspace = true

# HTTP client and JSON
reqwest.workspace = true
serde_json.workspace = true

# Testing
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Additional dependencies for test server binary
clap.workspace = true
async-trait.workspace = true
serde.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
serde_yml.workspace = true

[lib]
name = "mcp_elicitation_tests"
path = "src/lib.rs"

[[test]]
name = "elicitation_protocol_e2e"
path = "tests/elicitation_protocol_e2e.rs"
