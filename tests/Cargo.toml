[package]
name = "turul-mcp-framework-integration-tests"
version = "0.4.0"
edition.workspace = true
autotests = false
# Test-only crate: `[[test]]` targets and no lib/bin. Never goes to crates.io.
publish = false

# 2025-11-25 E2E regression crate; framework deps pinned to the 2025 opt-in independent of the workspace 2026 default.
[dependencies]
turul-mcp-derive = { path = "../crates/turul-mcp-derive", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-server = { path = "../crates/turul-mcp-server", version = "0.4.0", default-features = false, features = ["http", "sse", "protocol-2025-11-25", "test-utils", "sqlite", "postgres", "dynamodb", "dynamic-tools"] }
turul-mcp-protocol = { path = "../crates/turul-mcp-protocol", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-builders = { path = "../crates/turul-mcp-builders", version = "0.4.0", default-features = false, features = ["protocol-2025-11-25"] }
turul-mcp-json-rpc-server = { workspace = true }
turul-mcp-session-storage = { path = "../crates/turul-mcp-session-storage", version = "0.4.0", default-features = false, features = ["in-memory", "protocol-2025-11-25"] }
turul-mcp-server-state-storage = { workspace = true }
turul-http-mcp-server = { path = "../crates/turul-http-mcp-server", version = "0.4.0", default-features = false, features = ["sse", "protocol-2025-11-25"] }
turul-mcp-client = { workspace = true }
turul-mcp-aws-lambda = { path = "../crates/turul-mcp-aws-lambda", version = "0.4.0", default-features = false, features = ["cors", "sse", "protocol-2025-11-25"] }
lambda_http = { workspace = true }
tokio = { workspace = true }
tokio-test = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
mcp-e2e-shared.workspace = true
serial_test.workspace = true
schemars = { workspace = true }

# === Consolidated test binaries (F2 optimization) ===
# Previously 39+ separate test binaries, now 7 consolidated + 1 standalone.
# Each consolidated binary groups related tests via #[path] mod imports.

[[test]]
name = "compliance"
path = "consolidated/compliance.rs"

[[test]]
name = "schema_tests"
path = "consolidated/schema_tests.rs"

[[test]]
name = "example_validation"
path = "consolidated/example_validation.rs"

[[test]]
name = "e2e_tests"
path = "consolidated/e2e_tests.rs"

[[test]]
name = "feature_tests"
path = "consolidated/feature_tests.rs"

[[test]]
name = "ping_auth_2025"
path = "ping_auth_2025.rs"

# Standalone: uses mod test_helpers which requires crate-root relative path
[[test]]
name = "session_context_macro_tests"
path = "session_context_macro_tests.rs"

# Derive macro integration tests (moved from crates/turul-mcp-derive/tests/)
[[test]]
name = "derive_comprehensive_tool_tests"
path = "derive_comprehensive_tool_tests.rs"

[[test]]
name = "derive_schemars_integration_test"
path = "derive_schemars_integration_test.rs"

[[test]]
name = "derive_zero_config_output_schema_test"
path = "derive_zero_config_output_schema_test.rs"

# Dynamic tools E2E (Dynamic mode transport proof)
[[test]]
name = "dynamic_tools_e2e"
path = "dynamic_tools_e2e.rs"

# Tasks E2E integration test (uses tasks-e2e-inmemory-server binary)
[[test]]
name = "tasks_e2e_inmemory"
path = "tasks_e2e_inmemory.rs"

# SessionEventDispatcher persistence proof (real StreamManager + real storage)
[[test]]
name = "event_dispatcher_persistence"
path = "event_dispatcher_persistence.rs"

# Client round-trip integration (real McpClient against spawned example servers)
[[test]]
name = "client_integration_test"
path = "client_integration_test.rs"

# Runtime capability truthfulness E2E (full server + resource-test-server startup)
[[test]]
name = "mcp_runtime_capabilities_validation"
path = "mcp_runtime_capabilities_validation.rs"

# Streamable HTTP behavior regression suite (progress/SSE/pagination/meta/lifecycle)
[[test]]
name = "streamable_http_behavior_regression"
path = "streamable_http_behavior_regression.rs"

# Guards against tests/*.rs files that are neither an explicit [[test]] target
# nor reachable via #[path] from a consolidated binary (autotests = false means
# such files silently never compile or run).
[[test]]
name = "reachability_guard"
path = "reachability_guard.rs"
