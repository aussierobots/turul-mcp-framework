[package]
name = "mcp-e2e-shared"
version = "0.4.0"
edition.workspace = true
publish = false
autotests = false

# 2025-11-25 E2E regression crate; no framework protocol-bearing deps, so nothing to pin here.
[dependencies]
reqwest = { workspace = true, features = ["json", "stream"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
uuid.workspace = true

[lib]
name = "mcp_e2e_shared"
path = "src/lib.rs"

[[test]]
name = "all"
path = "tests/all.rs"
